name: AI Task Verifier

# Correctness gates: typecheck, unit tests, dependency audit, agent-doc/task consistency.
#
# THIS WORKFLOW DOES NOT BLOCK A DEPLOY ON ITS OWN.
# It triggers on `push: [master]` — i.e. in parallel with the Vercel production build it is
# meant to gate. **Branch protection must be enabled in GitHub settings** (Settings →
# Branches → add a rule for `master`: require a pull request, and require the status checks
# `verify` (this workflow) plus `Lint, contrast & static gates` and
# `Visual regression & accessibility` from ui-verify.yml). That cannot be configured from
# the repository, so until an owner clicks it, a red run here cannot stop a bad deploy.
# Local agents run the regression test for the repro. This workflow runs
# typecheck and the unit suite. `.husky/pre-push` does not repeat them.
#
# `next build` deliberately does NOT run here — ui-verify.yml runs one production build per
# PR with dummy public Supabase env (no prod egress). A second build here would cost a
# third full build per PR without adding coverage.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (lib/glr contracts)
        run: npm test

      - name: Dependency audit — production deps (high+, blocking)
        run: npm audit --audit-level=high --omit=dev

      - name: Dependency audit — full tree incl. dev (report-only)
        if: always()
        run: |
          npm audit --audit-level=high || echo "::warning title=npm audit (dev deps)::High-severity findings in dev dependencies; see log. Known dev-only chain: eslint-config-next -> fast-glob -> micromatch -> braces (no upstream fix yet; re-check when eslint-config-next updates)."

      - name: Reconcile tasks (identity only; commit-subject gate retired)
        run: node scripts/reconcile_tasks.js --strict --strict-since=2026-07-15

      - name: Validate agent doc links
        run: node scripts/validate-agent-docs.js

      - name: Validate FEATURE_INDEX paths
        run: node scripts/validate-feature-index.js

      - name: Validate related_files on open tasks
        run: node scripts/validate-related-files.js

      - name: Validate shared/ui allowlist
        run: node scripts/validate-shared-ui-allowlist.js

      - name: Upload reconcile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcile-report
          path: reports/task-reconcile-report.json
