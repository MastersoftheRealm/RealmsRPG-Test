# Independent critic merge gate (enforcement).
#
# CHECK CONTEXT (use this exact string in the repository ruleset):
#   Realms Independent Critic
#
# Only this workflow may post conclusion=success for that check name on a PR head.
# On every PR push the check returns to in_progress (voiding any prior approval).
#
# Critic session (separate from the writer): run /audit, run tests locally, then
# submit via repository_dispatch or workflow_dispatch with CRITIC_SUBMIT_TOKEN.
#
# Repository secrets (names only; set in GitHub Settings → Secrets → Actions):
#   CRITIC_SUBMIT_TOKEN — shared with the Cursor critic cloud agent only (never the writer).
#
# Critic agent also needs a PAT (name only, store in Cursor cloud secrets):
#   GITHUB_CRITIC_DISPATCH_TOKEN — repo + workflow scope to call repository_dispatch or gh workflow run.

name: Independent critic gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  repository_dispatch:
    types: [critic-verdict]
  workflow_dispatch:
    inputs:
      pull_number:
        description: PR number
        required: true
        type: number
      head_sha:
        description: Full head commit SHA the critic audited
        required: true
        type: string
      verdict:
        description: Critic verdict
        required: true
        type: choice
        options:
          - approve
          - reject
      critic_id:
        description: Critic agent/model id (for the check summary)
        required: true
        type: string
      submit_token:
        description: Must match CRITIC_SUBMIT_TOKEN
        required: true
        type: string
      repro_command:
        description: Optional extra command (must start with "npx vitest run ")
        required: false
        type: string
      summary_markdown:
        description: Short audit summary (markdown, no secrets)
        required: false
        type: string

permissions:
  checks: write
  contents: read
  pull-requests: read

env:
  CRITIC_CHECK_NAME: Realms Independent Critic

jobs:
  reset-check-on-push:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Mark critic check required for this SHA
        uses: actions/github-script@v7
        env:
          CHECK_NAME: ${{ env.CRITIC_CHECK_NAME }}
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const name = process.env.CHECK_NAME;
            const { data: existing } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              check_name: name,
              filter: 'latest',
            });
            for (const run of existing.check_runs) {
              if (run.status !== 'completed') {
                await github.rest.checks.update({
                  owner,
                  repo,
                  check_run_id: run.id,
                  status: 'completed',
                  conclusion: 'cancelled',
                  completed_at: new Date().toISOString(),
                  output: {
                    title: 'Superseded by new push',
                    summary: 'A new commit on the PR voided this critic check. Run a fresh independent /audit on the new head SHA.',
                  },
                });
              }
            }
            await github.rest.checks.create({
              owner,
              repo,
              name,
              head_sha: sha,
              status: 'in_progress',
              details_url: `https://github.com/${owner}/${repo}/pull/${context.payload.pull_request.number}`,
              output: {
                title: 'Awaiting independent critic',
                summary:
                  'A new push voided any prior critic approval. Start a **separate** Cursor session, run `/audit` on this exact SHA, run tests, then submit via `repository_dispatch` (`critic-verdict`) or `workflow_dispatch` with `CRITIC_SUBMIT_TOKEN`.',
              },
            });

  submit-critic-verdict:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: inputs
        uses: actions/github-script@v7
        env:
          CRITIC_SUBMIT_TOKEN: ${{ secrets.CRITIC_SUBMIT_TOKEN }}
        with:
          script: |
            const ev = context.payload;
            let pull_number, head_sha, verdict, critic_id, submit_token, repro_command, summary_markdown;
            if (context.eventName === 'repository_dispatch') {
              const c = ev.client_payload || {};
              pull_number = c.pull_number;
              head_sha = c.head_sha;
              verdict = c.verdict;
              critic_id = c.critic_id;
              submit_token = c.submit_token;
              repro_command = c.repro_command || '';
              summary_markdown = c.summary_markdown || '';
            } else {
              pull_number = ev.inputs.pull_number;
              head_sha = ev.inputs.head_sha;
              verdict = ev.inputs.verdict;
              critic_id = ev.inputs.critic_id;
              submit_token = ev.inputs.submit_token;
              repro_command = ev.inputs.repro_command || '';
              summary_markdown = ev.inputs.summary_markdown || '';
            }
            if (!pull_number || !head_sha || !verdict || !critic_id || !submit_token) {
              core.setFailed('Missing required critic submit fields.');
              return;
            }
            if (submit_token !== process.env.CRITIC_SUBMIT_TOKEN) {
              core.setFailed('Invalid critic submit token.');
              return;
            }
            core.setOutput('pull_number', String(pull_number));
            core.setOutput('head_sha', head_sha);
            core.setOutput('verdict', verdict);
            core.setOutput('critic_id', critic_id);
            core.setOutput('repro_command', repro_command);
            core.setOutput('summary_markdown', summary_markdown);

      - name: Verify PR head SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number('${{ steps.inputs.outputs.pull_number }}');
            const head_sha = '${{ steps.inputs.outputs.head_sha }}';
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            if (pr.head.sha !== head_sha) {
              core.setFailed(
                `head_sha ${head_sha} is not the current PR head (${pr.head.sha}). A new push voided this critic run.`,
              );
              return;
            }
            const labels = (pr.labels || []).map((l) => l.name);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('labels_json', JSON.stringify(labels));

      - uses: actions/checkout@v4
        if: steps.inputs.outputs.verdict == 'approve'
        with:
          ref: ${{ steps.inputs.outputs.head_sha }}

      - uses: actions/setup-node@v4
        if: steps.inputs.outputs.verdict == 'approve'
        with:
          node-version: '24'
          cache: npm

      - name: Install
        if: steps.inputs.outputs.verdict == 'approve'
        run: npm ci

      - name: Critic gate test bundle
        id: gate_tests
        if: steps.inputs.outputs.verdict == 'approve'
        run: node scripts/critic-gate-tests.mjs

      - name: Optional PR repro command
        if: steps.inputs.outputs.verdict == 'approve' && steps.inputs.outputs.repro_command != ''
        env:
          REPRO_CMD: ${{ steps.inputs.outputs.repro_command }}
        run: |
          case "$REPRO_CMD" in
            npx\ vitest\ run\ *)
              eval "$REPRO_CMD"
              ;;
            *)
              echo "::error::repro_command must start with: npx vitest run"
              exit 1
              ;;
          esac

      - name: High-risk label required
        id: high_risk
        if: steps.inputs.outputs.verdict == 'approve' && steps.gate_tests.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number('${{ steps.inputs.outputs.pull_number }}');
            const labels = JSON.parse('${{ steps.pr.outputs.labels_json }}');
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const highRiskPrefixes = [
              'sql/',
              'supabase/',
              'src/types/database.types.ts',
              'src/proxy.ts',
              'src/lib/supabase/',
              'src/app/(auth)/',
              'src/lib/api-mutation-guard.ts',
              'src/lib/api-validation.ts',
              'src/lib/game/',
              'src/lib/calculators/',
              'data/core-rules/',
              'src/app/(main)/admin/',
              'src/app/api/admin/',
              '.github/',
              'scripts/',
              '.husky/',
              'package.json',
              'package-lock.json',
              'next.config.ts',
              'vercel.json',
              '.env.example',
              'AGENTS.md',
              '.cursor/commands/',
              'src/docs/ai/ARCHITECTURE_CONSTITUTION.md',
            ];
            const touchesHighRisk = files.some((f) =>
              highRiskPrefixes.some((p) => f.filename === p || f.filename.startsWith(p)),
            );
            if (!touchesHighRisk) return;
            if (!labels.includes('high-risk')) {
              core.setFailed(
                'PR touches high-risk paths (AGENTS.md Risk by path) but is missing the GitHub label `high-risk`.',
              );
            }

      - name: Post critic check conclusion
        if: always() && steps.inputs.outcome == 'success' && steps.pr.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CHECK_NAME: ${{ env.CRITIC_CHECK_NAME }}
          VERDICT: ${{ steps.inputs.outputs.verdict }}
          CRITIC_ID: ${{ steps.inputs.outputs.critic_id }}
          HEAD_SHA: ${{ steps.inputs.outputs.head_sha }}
          SUMMARY: ${{ steps.inputs.outputs.summary_markdown }}
          GATE_OUTCOME: ${{ steps.gate_tests.outcome }}
          HIGH_RISK_OUTCOME: ${{ steps.high_risk.outcome }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const name = process.env.CHECK_NAME;
            const verdict = process.env.VERDICT;
            const head_sha = process.env.HEAD_SHA;
            const critic = process.env.CRITIC_ID;
            const gateFailed =
              verdict === 'approve' &&
              (process.env.GATE_OUTCOME === 'failure' || process.env.GATE_OUTCOME === 'skipped');
            const labelFailed = process.env.HIGH_RISK_OUTCOME === 'failure';
            const failed = verdict !== 'approve' || gateFailed || labelFailed;
            const conclusion = failed ? 'failure' : 'success';
            const summary = [
              `Critic: ${critic}`,
              `Verdict: ${verdict}`,
              `Head SHA: ${head_sha}`,
              '',
              process.env.SUMMARY || '(no summary)',
            ].join('\n');
            await github.rest.checks.create({
              owner,
              repo,
              name,
              head_sha,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: failed ? 'Independent critic: fail' : 'Independent critic: pass',
                summary,
              },
            });